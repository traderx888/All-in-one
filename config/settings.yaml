# Twitter/X Asset Monitoring - Global Settings

# --- Scraper Configuration ---
scraper:
  # Backend to use: "scweet" | "api" | "nitter"
  #   scweet  - Scweet (X GraphQL API + cookies) - RECOMMENDED for 2025-2026
  #   api     - Official Twitter API v2 (requires Bearer Token, $100+/mo)
  #   nitter  - Nitter RSS feeds (mostly dead in 2025+, unreliable)
  backend: "scweet"

  # Scweet settings (recommended backend)
  # Uses X's internal GraphQL API with cookie authentication
  # See README for how to get your cookies
  scweet:
    cookies_file: "config/cookies.json"   # X account cookies
    db_path: "data/scweet_state.db"       # Scweet internal state

  # Nitter instances (fallback only - most are dead)
  nitter_instances:
    - "https://nitter.privacydev.net"
    - "https://nitter.poast.org"
    - "https://nitter.woodland.cafe"

  # Twitter API v2 settings (only needed if backend: "api")
  twitter_api:
    bearer_token: ""  # Set via env var TWITTER_BEARER_TOKEN

  # Request settings
  request_timeout: 30          # seconds
  max_retries: 3
  retry_delay: 5               # seconds between retries
  user_agent: "Mozilla/5.0 (compatible; AssetMonitor/1.0)"

# --- Sentiment Analysis ---
sentiment:
  enabled: true                           # Enable FinTwitBERT sentiment scoring
  model: "StephanAkkerman/FinTwitBERT-sentiment"  # HuggingFace model ID
  show_in_console: true                   # Show sentiment in terminal output
  show_in_notifications: true             # Include sentiment in Telegram/Discord/LINE

# --- Polling Schedule ---
schedule:
  high_priority_interval: 120    # seconds (2 min)
  medium_priority_interval: 300  # seconds (5 min)
  low_priority_interval: 900     # seconds (15 min)

# --- Database ---
database:
  path: "data/tweets.db"
  max_tweets_per_account: 5000   # Keep last N tweets per account

# --- Notifications ---
notifications:
  # Enable/disable notification channels
  telegram:
    enabled: false
    bot_token: ""       # Set via env var TELEGRAM_BOT_TOKEN
    chat_id: ""         # Set via env var TELEGRAM_CHAT_ID

  discord:
    enabled: false
    webhook_url: ""     # Set via env var DISCORD_WEBHOOK_URL

  line:
    enabled: false
    access_token: ""    # Set via env var LINE_NOTIFY_TOKEN

  console:
    enabled: true       # Always print to console

  # Notification formatting
  include_sector_tag: true    # Prefix messages with [SECTOR] tag
  include_tweet_link: true    # Include link to original tweet

# --- Logging ---
logging:
  level: "INFO"               # DEBUG | INFO | WARNING | ERROR
  file: "data/monitor.log"
  max_size_mb: 10
  backup_count: 3
